[project]
name = "small-model-tool-use"
version = "0.1.0"
description = "Small model for accurate tool use: task generator, simulated sandbox, executor and scorer (portfolio project 04)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.uv]
package = false
